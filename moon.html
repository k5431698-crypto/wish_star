<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15123a">
  <title>달 위 시안 · 소원 별 우체국</title>
  <style>
    html, body { height: 100%; margin: 0; background: #15123a; overflow: hidden; }
    body {
      color: #e9e6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .back {
      position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 16px; z-index: 3;
      color: #cfc9f5; font-size: 0.9rem; text-decoration: none;
      padding: 8px 12px; border-radius: 999px; background: rgba(20, 16, 56, 0.55);
    }
    .hint {
      position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px); z-index: 3;
      text-align: center; font-size: 0.95rem; color: #d8d2fa; pointer-events: none; text-shadow: 0 1px 6px #15123a, 0 0 12px #15123a;
      transition: opacity 1.2s ease;
    }
    .hint.off { opacity: 0; }
    #bubble {
      position: fixed; z-index: 3; left: 0; top: 0; transform: translate(-50%, -100%);
      max-width: 220px; padding: 9px 14px; border-radius: 16px;
      background: rgba(255, 250, 240, 0.95); color: #3a3270; font-size: 0.92rem; line-height: 1.4;
      text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.25s ease;
    }
    #bubble.on { opacity: 1; }
    #fail { display: none; position: fixed; inset: 0; z-index: 4; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #cfc9f5; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← 소원 별로</a>
  <div class="hint" id="hint">달을 눌러 걸어가요 · 친구와 별 요정도 눌러 보세요</div>
  <div id="bubble"></div>
  <div id="fail">이 기기에서는 3D 화면을 열 수 없어요.</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="moon.js"></script>
</body>
</html>
